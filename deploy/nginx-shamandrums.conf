# /etc/nginx/sites-available/shamandrums.ru
# Статика (dist) + проксирование /api на Node. HTTPS добавит certbot автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name shamandrums.ru www.shamandrums.ru;

    root /var/www/shamandrums/dist;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → Node backend (приём заявок)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Иммутабельные ассеты сборки
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Фото/вебпы
    location /generated/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA-фолбэк (на всякий случай; сайт на hash-роутинге)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
